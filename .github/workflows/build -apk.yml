name: Build Dayflow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip DayflowAndroid_PhoneBuild.zip -d project
          find project -maxdepth 3 -type f | head -80

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project
          find . -name gradlew -type f -print
